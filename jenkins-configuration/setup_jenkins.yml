---
- name: Setting up Jenkins
  hosts: all
  become: yes
  vars_files:
    - vars/.env
    - vars/main.yml
  vars:
    terraform_version: "1.15.7"
    terraform_install_dir: "/usr/local/bin"
    terraform_download_url: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_amd64.zip"

  tasks:

    - name: Install unzip
      ansible.builtin.package:
        name: unzip
        state: present

    - name: Download Terraform binary
      ansible.builtin.get_url:
        url: "{{ terraform_download_url }}"
        dest: "/tmp/terraform_latest.zip"

    - name: Extract Terraform binary
      ansible.builtin.unarchive:
        src: "/tmp/terraform_latest.zip"
        dest: "{{ terraform_install_dir }}"
        remote_src: yes
        extra_opts: "-o"

    - name: Set Terraform permissions
      ansible.builtin.file:
        path: "{{ terraform_install_dir }}/terraform"
        mode: "0755"
        state: touch
    - name: Install java
      ansible.builtin.apt:
        name: openjdk-21-jre
        state: present
        update_cache: yes

    - name: Install java
      ansible.builtin.apt:
        name: openjdk-21-jre
        state: present
        update_cache: yes

    - name: Add jenkins apt repository key.
      shell: |
         wget -O /etc/apt/keyrings/jenkins-keyring.asc https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
         echo "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc]" https://pkg.jenkins.io/debian-stable binary/ | sudo tee /etc/apt/sources.list.d/jenkins.list > /dev/null

    - name: Install jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: yes

    - name: Install ansible
      ansible.builtin.apt:
        name: ansible
        state: present
        update_cache: yes

    - name: Creates directory for disabling initial page
      ansible.builtin.file:
        path: /var/lib/jenkins/init.groovy.d/
        state: directory

    - name: Copy the file to disable jenkins initial page
      ansible.builtin.copy:
        src: ./templates/disable_unlock.groovy
        dest: /var/lib/jenkins/init.groovy.d/

    - name: write hostname using jinja2
      ansible.builtin.template:
        src: ./templates/create_user.groovy
        dest: /var/lib/jenkins/init.groovy.d/

    - name: Restart jenkins service
      service:
        name: jenkins
        state: restarted

    - name: install plugins
      community.general.jenkins_plugin:
        name: "{{ item }}"
        state: latest
        url_username: "{{ jenkins_user }}"
        url_password: "{{ jenkins_pass }}"
      with_items: "{{ jenkins_plugins }}"

    - name: Restart jenkins service
      service:
        name: jenkins
        state: restarted
