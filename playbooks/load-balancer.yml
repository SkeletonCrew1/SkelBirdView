- name: Set up load-balancer
  hosts: load_balancers
  gather_facts: true

  tasks:

    - name: Setting host facts using complex arguments
      ansible.builtin.set_fact:
        SERVER1: "{{ lookup('amazon.aws.secretsmanager_secret', 'SERVER1', region='us-east-1') }}"
        SERVER2: "{{ lookup('amazon.aws.secretsmanager_secret', 'SERVER2', region='us-east-1') }}"
        cacheable: true

    - name: Install dependencies and update apt
      ansible.builtin.apt:
        name: "nginx"
        state: present
        update_cache: true
      become: true

    - name: Render template for Nginx
      ansible.builtin.template:
        src: /var/lib/jenkins/workspace/setting-up-EC2s/playbooks/templates/load_balancer.j2
        dest: /etc/nginx/sites-available/default
        mode: '0755'
      vars:
        SERVER1: "10.0.11.105"
        SERVER2: "10.0.12.163"
      become: true

    - name: Restarn Nginx load balancer
      ansible.builtin.systemd_service:
        name: nginx
        state: restarted
        enabled: true
      become: true

    - name: Make sure 'nginx' is started
      systemd:
        name: nginx
        state: started
        enabled: yes
