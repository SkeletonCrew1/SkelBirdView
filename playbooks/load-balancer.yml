- name: Set up load-balancer
  hosts: load_balancers
  become: true

  tasks:
    - name: Look Up Secrets
      ansible.builtin.set_fact:
        SERVER1: "{{ lookup('env', 'SERVER1')  }}"
        SERVER2: "{{ lookup('env', 'SERVER2')  }}"
        cacheable: true

    - name: Install dependencies and update apt
      ansible.builtin.apt:
        name: "nginx"
        state: present
        update_cache: true

    - name: Render template for Nginx
      ansible.builtin.template:
        src: ./templates/load_balancer.j2
        dest: /etc/nginx/sites-available/default
        mode: '0755'
      vars:
        SERVER1: "{{ SERVER1 }}"
        SERVER2: "{{ SERVER2 }}"

    - name: Restarn Nginx load balancer
      ansible.builtin.systemd_service:
        name: nginx
        state: restarted
        enabled: true

    - name: Make sure 'nginx' is started
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Enable Process Monitoring
      copy:
        dest: /etc/datadog-agent/conf.d/process.d/conf.yaml
        content: |
          init_config:

          instances:
            - name: load-balancer
              search_string:
                - "nginx"

    - name: Restart Datadog Agent
      ansible.builtin.systemd_service:
        name: datadog-agent
        state: restarted
        enabled: true
