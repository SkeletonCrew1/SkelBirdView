- name: Set up load-balancer
  hosts: load_balancers
  gather_facts: true

  tasks:

    - name: Setting host facts using complex arguments
      ansible.builtin.set_fact:
        SERVER1: "{{ lookup('env', 'SERVER1')  }}"
        SERVER2: "{{ lookup('env', 'SERVER2')  }}"
        cacheable: true

    - name: Install dependencies and update apt
      ansible.builtin.apt:
        name: "nginx"
        state: present
        update_cache: true
      become: true

    - name: Render template for Nginx
      ansible.builtin.template:
        src: ./templates/load_balancer.j2
        dest: /etc/nginx/sites-available/default
        mode: '0755'
      vars:
        SERVER1: "{{ SERVER1 }}"
        SERVER2: "{{ SERVER2 }}"
      become: true

    - ansible.builtin.debug:
        msg: "the value of foo.txt is {{ lookup('ansible.builtin.file', '/etc/nginx/sites-available/default') }}"

    - name: Restarn Nginx load balancer
      ansible.builtin.systemd_service:
        name: nginx
        state: restarted
        enabled: true
      become: true

    - name: Make sure 'nginx' is started
      systemd:
        name: nginx
        state: started
        enabled: yes
