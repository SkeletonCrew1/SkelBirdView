- name: Set up load-balancer
  hosts: load_balancers
  gather_facts: true

  tasks:

    - name: Setting host facts using complex arguments
      ansible.builtin.set_fact:
        SERVER1: "{{ lookup('env', 'SERVER1')  }}"
        SERVER2: "{{ lookup('env', 'SERVER2')  }}"
        cacheable: true

    - name: Install dependencies and update apt
      ansible.builtin.apt:
        name: "nginx"
        state: present
        update_cache: true
      become: true

    - name: Render template for Nginx
      ansible.builtin.template:
        src: ./templates/load_balancer.j2
        dest: /etc/nginx/sites-available/default
        mode: '0755'
      vars:
        SERVER1: "{{ SERVER1 }}"
        SERVER2: "{{ SERVER2 }}"
      become: true

    - name: Restart Nginx load balancer
      ansible.builtin.systemd_service:
        name: nginx
        state: restarted
        enabled: true
      become: true

    - name: Install certbot
      ansible.builtin.pip:
        name:
          - certbot
          - certbot-nginx
        executable: pip3
      tags:
        - nginx
        - certbot

    - name: Register certbot
      shell: |
        certbot -n register --agree-tos --email me@domain.example
        touch /etc/letsencrypt/.registered
      args:
        creates: /etc/letsencrypt/.registered
      tags:
        - nginx
        - certbot

    - name: Setup cronjob for renewal
      cron:
        name: certbot-renewal
        job: "/bin/bash -lc '/usr/local/bin/certbot -q renew'"
        minute: "0"
        hour: "14"
      tags:
        - nginx
        - certbot

    - name: 'Get certificate'
      command: '/usr/local/bin/certbot -n --nginx certonly -d {{ hostname }}'
      args:
        creates: '/etc/letsencrypt/live/{{ hostname }}'
      ignore_errors: true
      tags:
        - nginx
        - certbot

    - name: Make sure 'nginx' is started
      systemd:
        name: nginx
        state: started
        enabled: yes
