---
- name: Try to ping
  hosts: webservers
  become: true

  vars:
    packages:
      - python3
      - python3-pip
      - python3-venv

  tasks:
    - name: Look Up Secrets
      ansible.builtin.set_fact:
        JSON_DB_USER: "{{ lookup('env', 'DB_USER') }}"
        JSON_DB_NAME: "{{ lookup('env', 'DB_NAME') }}"
        JSON_DB_PASSWORD: "{{ lookup('env', 'DB_PASSWORD') }}"
        JSON_DB_HOST: "{{ lookup('env', 'DB_HOST') }}"
        JSON_AWS_ACCESS_KEY: "{{ lookup('env', 'AWS_ACCESS_KEY') }}"
        JSON_AWS_SECRET_KEY: "{{ lookup('env', 'AWS_SECRET_KEY') }}"
        JSON_S3_BUCKET: "{{ lookup('env', 'S3_BUCKET') }}"
        cacheable: true

    - name: Parse the database variables
      ansible.builtin.set_fact:
        DB_USER: "{{ JSON_DB_USER | ansible.builtin.from_json | community.general.json_query('DB_USER') }}"
        DB_NAME: "{{ JSON_DB_NAME | ansible.builtin.from_json | community.general.json_query('DB_NAME') }}"
        DB_PASSWORD: "{{ JSON_DB_PASSWORD | ansible.builtin.from_json | community.general.json_query('DB_PASSWORD') }}"
        DB_HOST: "{{ JSON_DB_HOST | ansible.builtin.from_json | community.general.json_query('DB_HOST') }}"
        AWS_ACCESS_KEY: "{{ JSON_AWS_ACCESS_KEY | ansible.builtin.from_json | community.general.json_query('AWS_ACCESS_KEY') }}"
        AWS_SECRET_KEY: "{{ JSON_AWS_SECRET_KEY | ansible.builtin.from_json | community.general.json_query('AWS_SECRET_KEY') }}"
        S3_BUCKET: "{{ JSON_S3_BUCKET | ansible.builtin.from_json | community.general.json_query('S3_BUCKET') }}"

    - name: Install dependencies and update apt
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop: "{{ packages }}"

    - name: Copy source code
      ansible.builtin.git:
        repo: "https://github.com/SkeletonCrew1/SkelBirdView.git"
        dest: /home/jenkins/application
        version: test-application
        force: yes

    - name: Copy source code
      ansible.builtin.git:
        repo: "https://github.com/SkeletonCrew1/SkelBirdView.git"
        dest: /home/jenkins/configs
        version: config_files
        force: yes

    - name: Template .env
      ansible.builtin.template:
        src:  ./templates/env_templates
        dest: /home/jenkins/application/web-servers/.env
      vars:
        DB_USER: "{{ DB_USER }}"
        DB_NAME: "{{ DB_NAME }}"
        DB_PASSWORD: "{{ DB_PASSWORD }}"
        DB_HOST: "{{ DB_HOST }}"
        AWS_ACCESS_KEY: "{{ AWS_ACCESS_KEY }}"
        AWS_SECRET_KEY: "{{ AWS_SECRET_KEY }}"
        S3_BUCKET: "{{ S3_BUCKET }}"

    - name: Manually create the initial virtualenv
      command:
        cmd: python3 -m venv {{ venv_path }}
        creates: "{{ venv_path }}"
      vars:
        venv_path: "/home/jenkins/application/web-servers/venv"

    - name: Install requirements
      ansible.builtin.pip:
        requirements: "/home/jenkins/application/web-servers/requirements.txt"
        virtualenv: "{{ venv_path }}"
        virtualenv_python: python3.5
      vars:
        venv_path: "/home/jenkins/application/web-servers/venv"

    - name: Change file ownership, group and permissions run.py
      ansible.builtin.file:
        path: /home/jenkins/application/web-servers/run.py
        owner: jenkins
        group: jenkins
        mode: '0755'

    - name: Change file ownership, group and permissions .env
      ansible.builtin.file:
        path: /home/jenkins/application/web-servers/.env
        owner: jenkins
        group: jenkins
        mode: '0755'

    - name: Move service file for the app
      ansible.builtin.copy:
        src: /home/jenkins/configs/web_server_config/SkelBirdView.service
        dest: /etc/systemd/system/SkelBirdView.service
        owner: jenkins
        group: jenkins
        mode: '0644'
        remote_src: yes

    - name: Change permissions for web-servers folder
      ansible.builtin.file:
        dest: "/home/jenkins/application/web-servers/"
        owner: 'jenkins'
        group: 'jenkins'
        recurse: true
        mode: u=rwX,g=rX,o=rX

    - name: Make sure service that starts run.py is started and enabled
      systemd:
        name: SkelBirdView.service
        state: restarted
        enabled: yes
        daemon_reload: yes

    - name: Restart Datadog Agent
      ansible.builtin.systemd_service:
        name: datadog-agent
        state: restarted
        enabled: true
