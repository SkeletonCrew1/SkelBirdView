- name: Try to ping
  hosts: databases
  gather_facts: true
  tasks:
    - name: Setting host facts using complex arguments
      ansible.builtin.set_fact:
        DB_USER: "{{ lookup('env', 'DB_USER') }}"
        DB_NAME: "{{ lookup('env', 'DB_NAME') }}"
        DB_PASSWORD: "{{ lookup('env', 'DB_PASSWORD') }}"
        datadog_api_key: "{{ lookup('env', 'datadog_api_key') }}"
        datadog_site: "{{ lookup('env', 'datadog_site') }}"
        cacheable: true

    - name: Installing Mysql and dependencies
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop:
        - mysql-server
        - python3-pymysql
      become: true

    - name: start and enable mysql service
      ansible.builtin.service:
        name: mysql
        state: started
        enabled: yes

    - name: Clone the config files
      ansible.builtin.git:
        repo: "https://github.com/SkeletonCrew1/SkelBirdView.git"
        dest: /home/configs
        version: config_files
      become: true

    - name: Move MySQL config file
      ansible.builtin.copy:
        src: /home/configs/database_config/mysqld.cnf
        dest: /etc/mysql/mysql.conf.d/mysqld.cnf
        remote_src: yes
      become: true

    - name: Restart MySQL service
      ansible.builtin.systemd_service:
        name: mysql
        state: restarted
        enabled: true
      become: true

    - name: ensure mysql is running
      ansible.builtin.service:
        name: mysql
        state: started

    - name: Create the database user
      community.mysql.mysql_user:
        name: "{{ DB_USER }}"
        plugin_auth_string: "{{ DB_PASSWORD }}"
        host: "%"
        priv: "*.*:ALL"
        state: present
        plugin: caching_sha2_password
        login_unix_socket: /var/run/mysqld/mysqld.sock
      become: true

    - name: Create the database
      community.mysql.mysql_db:
        name: flask_stuff
        state: present
        login_user: "{{ DB_USER }}"
        login_password: "{{ DB_PASSWORD }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
      become: true

    - name: Datadog Base Config
      copy:
        dest: /etc/datadog-agent/datadog.yaml
        content: |
          api_key: "{{ datadog_api_key }}"
          site: "{{ datadog_site }}"

          logs_enabled: true

          process_config:
            enabled: "true"

    - name: Enable Process Monitoring
      copy:
        dest: /etc/datadog-agent/conf.d/process.d/conf.yaml
        content: |
          init_config:

          instances:
            - name: database_processes
              search_string:
                - "mysql"

    - name: Restart Datadog Agent
      ansible.builtin.systemd_service:
        name: datadog-agent
        state: restarted
        enabled: true
      become: true

  roles:
    - datadog.datadog
