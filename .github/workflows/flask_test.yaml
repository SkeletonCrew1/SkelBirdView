name: Run pytests for flask app

on:
  workflow_dispatch:
  pull_request:

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        uses: py-actions/py-dependency-install@v4
        with:
          path: "web-servers/requirements.txt"

      - name: Run python script with gihub secrets
        working-directory: ./web-servers
        run: python -m pytest
